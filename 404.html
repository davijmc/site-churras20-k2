<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página Não Encontrada — República K2 | 20 Anos</title>
  <link rel="icon" type="image/png" href="imagens/Logo%20Churras.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=Cinzel:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .error-page-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem;
      background: radial-gradient(circle at center, var(--bg-bonina-panel) 0%, var(--bg-obsidian) 70%);
    }
    .error-card {
      max-width: 580px;
      padding: 3rem 2rem;
      border: 1px solid var(--gold-border);
      border-radius: 12px;
      background-color: rgba(20, 9, 11, 0.92);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6), 0 0 24px rgba(245, 197, 24, 0.12);
    }
    .error-logo {
      width: 140px;
      height: 140px;
      object-fit: contain;
      margin-bottom: 1.5rem;
      filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.5));
    }
    .error-code {
      font-family: var(--font-display);
      font-size: 3.5rem;
      font-weight: 800;
      color: var(--gold-imperial);
      letter-spacing: 2px;
      line-height: 1;
      margin-bottom: 0.5rem;
    }
    .error-title {
      font-family: var(--font-display);
      font-size: 1.5rem;
      color: var(--text-ivory);
      margin-bottom: 1rem;
    }
    .error-text {
      font-family: var(--font-body);
      font-size: 1.05rem;
      color: var(--text-warm);
      line-height: 1.6;
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>
  <main class="error-page-wrapper">
    <div class="error-card">
      <img src="imagens/Logo%20Churras.png" alt="República K2" class="error-logo">
      <div class="error-code">404</div>
      <h1 class="error-title">Fora da Trilha do K2</h1>
      <p class="error-text">
        Esta rota se perdeu na neblina ou desceu para o DA antes da hora. Mas o grande banquete de 20 Anos continua te esperando no cume!
      </p>
      <a href="/" class="btn-imperial btn-gold">
        Voltar à Página Principal
      </a>
    </div>
  </main>
</body>
</html>
